name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install Linux credential-store runtime
        run: sudo apt-get update && sudo apt-get install --yes libsecret-1-0
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm pack --dry-run --ignore-scripts
